<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Map demo</title>
<style>body{margin:0;background:#111}canvas{width:100%;max-width:1200px;display:block;margin:auto}</style></head>
<body><canvas id="cv"></canvas>
<script src="map_collision.js"></script>
<script>
(async () => {
  const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  const img = new Image(); img.src = 'map.png'; await img.decode();
  cv.width = img.naturalWidth; cv.height = img.naturalHeight;
  const map = await loadMap('map_collision.json');
  const raw = await (await fetch('map_collision.json')).json();
  const player = { c: map.spawn ? map.spawn[0] : 0, r: map.spawn ? map.spawn[1] : 0 };
  let debug = false;

  // screen directions on the isometric diamond
  const keys = { ArrowUp:[-1,-1], ArrowDown:[1,1], ArrowLeft:[-1,1], ArrowRight:[1,-1] };
  addEventListener('keydown', e => {
    if (keys[e.key]) { map.tryMove(player, ...keys[e.key]); e.preventDefault(); }
    if (e.key === 'g' || e.key === 'G') debug = !debug;
  });

  function poly(c, r) {
    const q = [[c,r],[c+1,r],[c+1,r+1],[c,r+1]].map(([a,b]) => map.gridToScreen(a,b));
    ctx.beginPath(); q.forEach((p,i) => i ? ctx.lineTo(p.x,p.y) : ctx.moveTo(p.x,p.y)); ctx.closePath();
  }
  function frame() {
    ctx.drawImage(img, 0, 0);
    if (debug) for (let r = 0; r < map.rows; r++) for (let c = 0; c < map.cols; c++) {
      poly(c, r);
      if (raw.blocked[r][c]) { ctx.fillStyle = 'rgba(255,0,0,.4)'; ctx.fill(); }
      ctx.strokeStyle = 'rgba(0,255,255,.4)'; ctx.stroke();
    }
    poly(player.c, player.r); ctx.fillStyle = 'rgba(0,255,120,.8)'; ctx.fill();
    requestAnimationFrame(frame);
  }
  frame();
})();
</script></body></html>
